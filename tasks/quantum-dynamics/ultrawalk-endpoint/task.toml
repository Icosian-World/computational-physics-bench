difficulty_explanation = "This task requires implementing a site-dependent unitary quantum walk with sparse hierarchy-level disorder, extracting asymptotic transport behavior from finite-time data, and estimating a localization endpoint under stochastic finite-size effects."
solution_explanation = "The reference solution implements the hierarchical quantum-walk simulator, computes RMS displacement over sampled times, estimates inverse walk dimension by late-time finite-time scaling, combines these estimates with the provided long-run observations, and writes the critical endpoint and transport table."
verification_explanation = "The verifier uses a graded rubric rather than a binary trapdoor: it scores required artifacts, simulator import and hidden-seed physics agreement, finite-time scaling behavior, epsilon endpoint accuracy, transport-table consistency with the bundled public observations, and a low-weight human-audit visualization artifact. The reward file is written in Harbor-compatible numeric JSON while detailed rubric diagnostics are emitted separately."
rubric_path = "tasks/quantum-dynamics/ultrawalk-endpoint/rubric.toml"

